<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- slate-system checks every caller itself; this policy only keeps everyone else from
     reaching it. The shell may call anything. Apps reach the key store through the
     slate-secrets group (the secrets permission) and the assistant API through the
     slate-assistant group (the assistant permission). -->
<busconfig>
  <policy user="slate-system">
    <allow own="org.slate.System"/>
  </policy>
  <policy user="slate">
    <allow send_destination="org.slate.System"/>
  </policy>
  <policy group="slate-secrets">
    <allow send_destination="org.slate.System" send_interface="org.slate.Keystore1"/>
  </policy>
  <policy group="slate-assistant">
    <allow send_destination="org.slate.System" send_interface="org.slate.Assistant1"/>
    <allow send_destination="org.slate.System" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.slate.System"/>
  </policy>
</busconfig>
