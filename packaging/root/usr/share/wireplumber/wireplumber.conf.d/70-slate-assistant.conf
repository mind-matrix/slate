# Only the selected voice assistant may use the microphone and speaker. See
# scripts/slate/assistant-gate.lua.
wireplumber.components = [
  {
    name = slate/assistant-gate.lua, type = script/lua
    provides = custom.slate-assistant-gate
  }
]

wireplumber.profiles = {
  main = {
    custom.slate-assistant-gate = required
  }
}
